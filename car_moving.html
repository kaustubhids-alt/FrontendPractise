<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            width: 100%;
            height: 100vh;
            background-color: aliceblue;
            display: flex;
            flex-direction: column;
            gap: 0px;
        }
        .box{
            width: 810px;
            height: 350px;
            background-color: gray;
            border-radius: 50px;

        }
        .car{
            width: 250px;
            height: 100px;
            background-image: url(./Cartoon-Car-PNG-Image-File.png);
            background-size: cover;
            /* background-color: aqua; */
            margin-left:200px;
            display: flex;
            animation-name: anime;
            animation-duration: 10s;
            position: relative;
            animation-iteration-count: infinite;
            animation-timing-function: linear;

        }
        .tyre1{
            background-image: url(./tire-removebg-preview.png);
            width: 57px;
            height: 57px;
            background-size: cover;
            margin-top: 48.5px;
            margin-left: 16px;
            animation-name: rotation;
            animation-iteration-count: infinite;
            animation-duration: 0.5s;
            animation-timing-function: linear;
        }
         .tyre2{
            background-image: url(./tire-removebg-preview.png);
            width: 57px;
            height: 57px;
            background-size: cover;
            margin-top: 48.5px;
            margin-left: 96px;
            animation-name: rotation;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            animation-duration: 0.5s;


        }
        @keyframes rotation {
            0%{
                top: 0px;
                left: 0px;
                transform: rotate(0deg);
                transform: rotate(-360deg);
                
                }
        
            }
        @keyframes anime {
            0%{
                top: 0px;
                left: 0px;
                transform: rotateZ(0deg);

                }
            
            
            25%{
                top:0px;
                left: 760px;
                transform: rotateZ(0deg);

                }
            26%{
                top:0px;
                left: 760px;
                transform: rotateZ(90deg);

                }

            50%{
                top: 450px;
                left: 720px;
                transform: rotateZ(90deg);
                
                 
                }

            51%{
                top: 450px;
                left: 720px;
                transform: rotateZ(180deg);
                
                 
                }

            75%{
                top: 460px;
                left: 0px;
                transform: rotateZ(180deg);

                
                }
            
            76%{
                top: 460px;
                left: -100px;
                transform: rotateZ(270deg);

                
                }

            100%{
                top: 0px;
                left: -100px;
                transform: rotateZ(270deg);

                
            }

    }

    </style>
</head>
<body>
    <div class="main"><br><br>
        <div class="car">
            <div class="tyre1"></div>
            <div class="tyre2"></div>

        </div>
        <center>
        <div class="box"></div></center>
        
    </div>
</body>
</html>
